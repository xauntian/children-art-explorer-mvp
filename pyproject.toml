[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mijia-pocket-printer-1s"
version = "0.1.0"
description = "A Windows Bluetooth photo-print client and offline card layout for the Xiaomi Mijia 1S"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mijia1s = "mijia1s.cli:main"

[project.urls]
ARTO = "https://github.com/xauntian/children-art-explorer-mvp"

[tool.setuptools]
packages = ["mijia1s"]

[tool.setuptools.package-data]
mijia1s = ["assets/*.ttf", "assets/*.txt", "assets/*.json", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
